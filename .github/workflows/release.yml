name: Release Nyakitsu

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows
            os_family: windows
            arch: x64
            runner: windows-latest
          - artifact: linux-x64
            os_family: linux
            arch: x64
            runner: [self-hosted, Linux, docker, buildx]
          - artifact: linux-arm64
            os_family: linux
            arch: arm64
            runner: [self-hosted, Linux, docker, buildx]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build (windows)
        if: matrix.os_family == 'windows'
        run: npm run dist:win -- --publish=never

      - name: Build (linux x64)
        if: matrix.os_family == 'linux' && matrix.arch == 'x64'
        run: npm run build && npx electron-builder --linux --x64 --publish=never

      - name: Build (linux arm64)
        if: matrix.os_family == 'linux' && matrix.arch == 'arm64'
        run: npm run build && npx electron-builder --linux --arm64 --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  changelog:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:'- %s (%h)' --no-merges
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              git log "${CURRENT_TAG}" --pretty=format:'- %s (%h)' --no-merges
            fi
          } > changelog.md

          {
            echo "body<<CHANGELOG_EOF"
            cat changelog.md
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.body }}
          generate_release_notes: false
          files: artifacts/**/*
          fail_on_unmatched_files: true
